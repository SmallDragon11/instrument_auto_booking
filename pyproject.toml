[project]
name = "instrument-booking"
version = "0.1.0"
requires-python = ">=3.13"  # 3.13 前 Windows 的 time.monotonic 解析度為 15.6 毫秒，會吃掉 NTP 0.05 秒餘量的大部分
# PySide6-Fluent-Widgets 鎖定次版本：主視窗把常駐提示插進 FluentWindow 的內部版面（widgetLayout）
dependencies = ["openpyxl>=3.1", "playwright>=1.50", "PySide6>=6.11", "PySide6-Fluent-Widgets>=1.11,<1.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.5"]
build = ["pyinstaller>=6.22"]  # tools/build_exe.py

[project.gui-scripts]
instrument-booking = "instrument_booking.app.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = ["live: 對測試副本的實機整合測試（需手動設定環境變數）"]
